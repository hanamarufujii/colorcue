<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ColorCue">
  <title>ColorCue</title>

  <!-- 挙手ライン：これより上に色が来たら反応する、という仕組みそのもの -->
  <line x1="5" y1="39" x2="59" y2="39" stroke="#3c424c" stroke-width="2"
        stroke-linecap="round" stroke-dasharray="4 5"/>

  <!-- ラインより上＝効いている色。青と緑（肌に反応しない色） -->
  <circle cx="21" cy="19" r="15" fill="#4d8dff" opacity=".16"/>
  <circle cx="21" cy="19" r="9"  fill="#4d8dff"/>

  <circle cx="44" cy="27" r="12" fill="#4ade80" opacity=".16"/>
  <circle cx="44" cy="27" r="7"  fill="#4ade80"/>

  <!-- ラインより下＝まだ選んでいない色。肌に近い色は1つも置かない -->
  <circle cx="14" cy="52" r="3.4" fill="#35c4c4" opacity=".55"/>
  <circle cx="27" cy="52" r="3.4" fill="#6b7fd7" opacity=".55"/>
  <circle cx="40" cy="52" r="3.4" fill="#8b7ff0" opacity=".55"/>
  <circle cx="53" cy="52" r="3.4" fill="#4aa3ff" opacity=".55"/>
</svg>
